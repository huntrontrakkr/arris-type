# Temporary read-only check of the published 2.001 font binary; remove after verification.
name: Issue 34 published v2.001 font probe
on:
  push:
    branches: [fix/issue-34-adjacent-cv27]
permissions:
  contents: read
jobs:
  shipped-font:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Download only the existing published release ZIP
        run: gh release download v2.001 --repo huntrontrakkr/arris-type --pattern 'Arris-2.001.zip' --dir /tmp
      - name: Shape the published Arris Mono font, without modifying it
        run: |
          uv run python - <<'PY'
          import io
          import zipfile
          from pathlib import Path
          import uharfbuzz as hb
          from fontTools.ttLib import TTFont

          archive = Path('/tmp/Arris-2.001.zip')
          with zipfile.ZipFile(archive) as z:
              candidates = [n for n in z.namelist() if n.endswith('ArrisMono-Regular.ttf')]
              print('Found:', candidates)
              assert len(candidates) == 1
              data = z.read(candidates[0])

          tt = TTFont(io.BytesIO(data))
          font = hb.Font(hb.Face(data))
          feats = {r.FeatureTag for r in tt['GSUB'].table.FeatureList.FeatureRecord}
          assert 'cv27' in feats, sorted(feats)

          def shape(text: str, **features: bool) -> tuple[list[str], list[int]]:
              buf = hb.Buffer()
              buf.add_str(text)
              buf.guess_segment_properties()
              hb.shape(font, buf, features)
              return ([tt.getGlyphName(info.codepoint) for info in buf.glyph_infos],
                      [p.x_advance for p in buf.glyph_positions])

          for calt in (False, True):
              for pairs in (1, 2, 3, 5):
                  sample = '[]' * pairs
                  on, adv = shape(sample, cv27=True, calt=calt)
                  off, off_adv = shape(sample, cv27=False, calt=calt)
                  print('Published v2.001:', repr(sample), 'calt=', calt, 'cv27=1', on, 'cv27=0', off, 'advances', adv)
                  assert off == ['bracketleft', 'bracketright'] * pairs
                  assert off_adv == [600] * len(sample)
                  assert adv == [600] * len(sample)
                  if pairs == 1:
                      assert on == ['LIG', 'bracketleft_bracketright.cv27']
                  else:
                      assert on != ['LIG', 'bracketleft_bracketright.cv27'] * pairs
          print('Published 2.001 reproduces issue #34: PASS')
          PY
