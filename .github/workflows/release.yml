# Build, check and publish a release.
#
# Push a tag v<version> (matching src/arris/version.py) and this builds every
# font on GitHub's runners, checks them, packages the zip and publishes the
# release with it, the notes taken from docs/RELEASE.md. Run it by hand
# (Actions, "Release", Run workflow) to build and check without publishing:
# the zip is left as the run's artifact. Run it by hand on main with
# "publish" ticked to release that commit: the release job creates the tag
# v<version> there itself (refusing if the tag exists already), so a release
# needs no one to push a tag.
#
# The build is split across runners as tools/rebuild.sh splits it across
# cores: each static family on one, each variable font on one of its own.
# Each job keeps its drawing cache (build/cache/draw.sqlite) between runs;
# each drawing in it is stamped with the modules it came from (arris.cache),
# so a change to one glyph module redraws that module's glyphs and keeps the
# rest, and a release that changes no drawing redraws nothing. Fontbakery
# runs in five jobs side by side, one a family or a variable font; its
# ital-axis check wants each italic and its Roman in one run, which the
# upright jobs make for the pairs. A variable font is uploaded and its cache
# saved as soon as it is written; its interpolation check runs in a job of
# its own after that, and may fail without failing the release (twice a
# runner was lost in the italic's check after a two-hour build, with the
# font finished). The GPU spike check (tools/vf_spikes.py) needs a CUDA GPU,
# which these runners lack: run it on a GPU machine before tagging if the
# variable fonts' interpolation changed. A published release's web fonts go
# to npm as @arristype/arris (npm.yml).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release, tagging this commit v<version> (main only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: static ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: arris, args: '' }
          - { name: watch, args: 'watch' }
          - { name: mono, args: 'mono' }
          - { name: italic, args: 'italic' }
          - { name: mono-italic, args: 'mono italic' }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/cache
          key: draw-${{ matrix.name }}-${{ hashFiles('src/**', 'uv.lock') }}
          restore-keys: draw-${{ matrix.name }}-
      - run: uv sync --frozen
      - name: Build
        run: ARRIS_BUILD_WORKERS=$(nproc) uv run python tools/build_fonts.py all ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: fonts-static-${{ matrix.name }}
          path: build/*.ttf
          if-no-files-found: error
      - name: Prune the drawing cache
        run: uv run python -c "from arris.cache import prune; print('dropped', prune(), 'drawings whose code changed')"
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  variable:
    name: variable ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: upright, args: '' }
          - { name: italic, args: 'italic' }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build/cache
          key: draw-vf-${{ matrix.name }}-${{ hashFiles('src/**', 'uv.lock') }}
          restore-keys: draw-vf-${{ matrix.name }}-
      - run: uv sync --frozen
      - name: Build
        run: ARRIS_VF_CHECK=0 ARRIS_VF_WORKERS=$(nproc) uv run python -m arris.vf ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: fonts-variable-${{ matrix.name }}
          path: build/Arris*GRAD*.ttf
          if-no-files-found: error
      - name: Prune the drawing cache
        run: uv run python -c "from arris.cache import prune; print('dropped', prune(), 'drawings whose code changed')"
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  check:
    name: check ${{ matrix.name }}
    needs: variable
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: upright, font: 'Arris[GRAD,WTCH,wght].ttf' }
          - { name: italic, font: 'Arris-Italic[GRAD,WTCH,wght].ttf' }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: draw-vf-${{ matrix.name }}-${{ hashFiles('src/**', 'uv.lock') }}
          restore-keys: draw-vf-${{ matrix.name }}-
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: fonts-variable-${{ matrix.name }}
          path: build
      - name: Interpolation check (the font against the drawings at the check's places)
        run: ARRIS_VF_WORKERS=2 uv run python tools/vf_compare.py "build/${{ matrix.font }}" "build/${{ matrix.font }}" --all
      - name: Topology (the font's outlines along the axes, arris.topology; the report an artifact)
        run: uv run python -m arris.topology "build/${{ matrix.font }}" --procs 2 --json "build/topology-${{ matrix.name }}.json" | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-${{ matrix.name }}
          path: build/topology-*.json
          if-no-files-found: ignore

  fontbakery:
    name: fontbakery ${{ matrix.name }}
    needs: [static, variable]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # (opentype/STAT/ital_axis pairs each italic with a Roman within one
        # run and fails an italic alone: the italic shards skip that check,
        # and the upright shards make it for the pairs, Romans and italics
        # together, in a run of that one check)
        include:
          - { name: upright, artifacts: 'fonts-static-*', files: 'build/Arris-Regular.ttf build/Arris-Black.ttf', skip: '',
              pair: 'build/Arris-Regular.ttf build/Arris-Black.ttf build/Arris-Italic.ttf build/Arris-BlackItalic.ttf' }
          - { name: italic, artifacts: 'fonts-static-italic', files: 'build/Arris-Italic.ttf build/Arris-BlackItalic.ttf',
              skip: '-x opentype/STAT/ital_axis', pair: '' }
          - { name: mono, artifacts: 'fonts-static-mono', files: 'build/ArrisMono-Regular.ttf build/ArrisMono-Black.ttf', skip: '', pair: '' }
          - { name: variable upright, artifacts: 'fonts-variable-*', files: '"build/Arris[GRAD,WTCH,wght].ttf"', skip: '',
              pair: '"build/Arris[GRAD,WTCH,wght].ttf" "build/Arris-Italic[GRAD,WTCH,wght].ttf"' }
          - { name: variable italic, artifacts: 'fonts-variable-italic', files: '"build/Arris-Italic[GRAD,WTCH,wght].ttf"',
              skip: '-x opentype/STAT/ital_axis', pair: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifacts }}
          path: build
          merge-multiple: true
      - name: fontbakery (no FAIL, no ERROR)
        run: |
          # fontbakery exits 1 on any FAIL, FATAL or ERROR (its -e default); its
          # summary lists every level, at 0 too, so the log is not grepped for them
          if uvx --quiet --from fontbakery fontbakery check-universal -l WARN ${{ matrix.skip }} ${{ matrix.files }} > fontbakery.log 2>&1; then
            grep -E "^ *(ERROR|FATAL|FAIL|WARN): [0-9]+" fontbakery.log || true
          else
            cat fontbakery.log; echo "::error::fontbakery reports FAILs or ERRORs"; exit 1
          fi
      - name: The ital axis, each italic beside its Roman
        if: matrix.pair != ''
        run: uvx --quiet --from fontbakery fontbakery check-universal -c opentype/STAT/ital_axis ${{ matrix.pair }}

  release:
    needs: [static, variable, fontbakery]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: fonts-*
          path: build
          merge-multiple: true
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          V=$(uv run python -c "import sys; sys.path.insert(0, 'src'); from arris.version import VERSION; print(VERSION)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/arris/version.py ($V)"; exit 1
          fi
          # a release by hand: from main only, and a version not released already
          if [ "$PUBLISH" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::publish from main only (this run is on $GITHUB_REF)"; exit 1; fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" > /dev/null 2>&1; then echo "::error::v$V is tagged already: set a new VERSION"; exit 1; fi
          fi
      - name: pytest
        run: uv run python -m pytest -q tests
      - name: Package
        run: uv run python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Arris-${{ steps.v.outputs.version }}
          path: build/release/Arris-${{ steps.v.outputs.version }}.zip
      - name: Publish
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          # the release's notes: what Arris is, then this version's section of docs/RELEASE.md
          uv run python - <<'PY'
          import os, re
          v = os.environ['V']
          notes = open('docs/RELEASE.md', encoding='utf-8').read()
          m = re.search(rf'^## {re.escape(v)}\b.*?\n(.*?)(?=^## |\Z)', notes, re.S | re.M)
          body = (
              'Arris is a chamfered sans: octagonal and monoline, every outer corner cut at 45 degrees. '
              'Nine weights in upright, italic and mono, plus variable fonts with weight, grade and watch axes. '
              'Free and open under the SIL Open Font License 1.1, with no Reserved Font Name.\n\n'
              f'**Download:** `Arris-{v}.zip` below: the static fonts (TTF), the two variable fonts, '
              'web fonts (WOFF2), the licence and a README.\n\n'
              f'### What\'s new in {v}\n\n' + (m.group(1).strip() if m else '') + '\n\n'
              'Full notes: [docs/RELEASE.md](https://github.com/huntrontrakkr/arris-type/blob/main/docs/RELEASE.md).\n')
          open('notes.md', 'w', encoding='utf-8').write(body)
          PY
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" "build/release/Arris-$V.zip" --title "Arris $V" --notes-file notes.md --verify-tag
          else
            # a release by hand: the tag v<version> is made on this run's commit
            gh release create "v$V" "build/release/Arris-$V.zip" --title "Arris $V" --notes-file notes.md --target "$GITHUB_SHA"
          fi

  npm:
    needs: release
    if: github.ref_type == 'tag' || inputs.publish == true
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
