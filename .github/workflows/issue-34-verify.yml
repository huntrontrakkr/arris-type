# Temporary branch-only verification for issue #34. Remove before finalizing.
name: Issue 34 bracket ligature verification
on:
  push:
    branches: [fix/issue-34-adjacent-cv27]

permissions:
  contents: read

jobs:
  brackets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: HarfBuzz feature regressions and Mono cell tests
        run: uv run python -m pytest -q tests/test_ligatures.py tests/test_mono_cell.py
      - name: Build current Arris Mono Regular
        run: ARRIS_BUILD_WORKERS=1 uv run python tools/build_fonts.py 400 mono
      - name: Shape the compiled font with HarfBuzz
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import uharfbuzz as hb
          from fontTools.ttLib import TTFont

          path = Path('build/ArrisMono-Regular.ttf')
          data = path.read_bytes()
          tt = TTFont(path)
          font = hb.Font(hb.Face(data))
          print('Font:', path, 'size:', len(data), 'upem:', font.face.upem)

          def shape(text: str, **features: bool) -> tuple[list[str], list[int]]:
              buf = hb.Buffer()
              buf.add_str(text)
              buf.guess_segment_properties()
              hb.shape(font, buf, features)
              return ([tt.getGlyphName(info.codepoint) for info in buf.glyph_infos],
                      [p.x_advance for p in buf.glyph_positions])

          for pairs in (1, 2, 3, 5):
              sample = '[]' * pairs
              for calt in (False, True):
                  yes, advances = shape(sample, cv27=True, calt=calt)
                  no, off_advances = shape(sample, cv27=False, calt=calt)
                  print(repr(sample), 'cv27=1', 'calt='+str(calt), yes, advances)
                  assert yes == ['LIG', 'bracketleft_bracketright.cv27'] * pairs
                  assert no == ['bracketleft', 'bracketright'] * pairs
                  assert advances == [600] * len(sample)
                  assert off_advances == [600] * len(sample)
          for sample in ('[[]]', '[[]', '[]]'):
              actual, advances = shape(sample, cv27=True)
              assert actual == [('bracketleft' if c == '[' else 'bracketright') for c in sample]
              assert advances == [600] * len(sample)
          print('Compiled-font cv27, calt and advances: PASS')
          PY
      - name: Check compiled Mono cell boundaries
        run: uv run python tools/mono_cell_check.py build/ArrisMono-Regular.ttf
