name: npm
on:
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        required: true
        options: [older, newest]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish verified historical releases
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ inputs.batch }}
        run: |
          while read -r font_version version packager_tag expected; do
            if [[ "$BATCH" == newest && "$version" != 1.13.0 ]] || [[ "$BATCH" == older && "$version" == 1.13.0 ]]; then
              continue
            fi

            spec="@arristype/arris@$version"
            if published=$(npm view "$spec" dist.shasum); then
              test "$published" = "$expected"
              echo "$spec is already on npm with the expected checksum."
              continue
            fi

            echo "Preparing $spec from Arris $font_version"
            work="$RUNNER_TEMP/Arris-$font_version"
            zip="Arris-$font_version.zip"
            mkdir -p "$work"
            if [[ -f ".github/npm-history/$zip" ]]; then
              cp ".github/npm-history/$zip" "$work/$zip"
            else
              gh release download "v$font_version" --pattern "$zip" --dir "$work"
            fi
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/tools/npm_package.py?ref=$packager_tag" > "$work/package.py"
            python3 "$work/package.py" "$work/$zip" "$work/package"
            (
              cd "$work/package"
              tarball=$(npm pack --silent --pack-destination "$work")
              echo "$expected  $work/$tarball" | sha1sum --check --strict
              npm publish "$work/$tarball" --access public --tag archive --provenance
            )
          done < .github/npm-history/packages.txt
