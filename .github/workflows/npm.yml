# Publish the web fonts of a release to npm as @arristype/arris: the release
# zip's WOFF2s with CSS (tools/npm_package.py), the package's version the
# font's (1.005 is 1.5.0). The Release workflow calls it once a release is
# published; run it by hand (Actions, "npm", Run workflow) for a version
# already released. It needs the repository secret NPM_TOKEN, an npm token
# that may publish to the arristype scope: without it, it says so and
# publishes nothing. Set the repository variable NPM_STAGE_RELEASES to true
# to stage each version for a maintainer to approve on npm with 2FA.
name: npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to publish (1.005); empty for src/arris/version.py
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Version
        id: v
        env:
          V: ${{ inputs.version }}
        run: |
          if [ -z "$V" ]; then V=$(python3 -c "import sys; sys.path.insert(0, 'src'); from arris.version import VERSION; print(VERSION)"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: The release zip
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: gh release download "v$V" --pattern "Arris-$V.zip" --dir build/release
      - name: Package
        run: python3 tools/npm_package.py "build/release/Arris-${{ steps.v.outputs.version }}.zip" build/npm
      - name: Publish
        working-directory: build/npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STAGE_RELEASES: ${{ vars.NPM_STAGE_RELEASES }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::no NPM_TOKEN secret: the package is built but not published"; exit 0
          fi
          NAME=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version > /dev/null 2>&1; then
            echo "$NAME@$VER is on npm already"; exit 0
          fi
          if [ "$STAGE_RELEASES" = "true" ]; then
            staged=$(npm stage list "$NAME" --json | jq -r --arg version "$VER" '.[] | select(.version == $version) | .id')
            if [ -n "$staged" ]; then
              echo "$NAME@$VER is already staged ($staged)"; exit 0
            fi
            npm stage publish --access public --provenance
          else
            npm publish --access public --provenance
          fi
