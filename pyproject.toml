[project]
name = "arris"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "cairosvg>=2.9.1",
    "fonttools>=4.67.0",
    "freetype-py>=2.5.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "skia-pathops>=0.9.2",
    "uharfbuzz>=0.56.3",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest>=9.1.1",
]
